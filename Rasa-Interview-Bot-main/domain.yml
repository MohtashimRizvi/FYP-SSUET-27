version: "3.1"

intents:
  - greet
  - provide_technology
  - answer_question
  - goodbye

entities:
  - technology

slots:
  technology:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: technology

  answers:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  scores:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  questions:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  current_question_index:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hello! Which technology are you interviewing for? (Web Development, App Development, or AI)"
  utter_goodbye:
    - text: "Thanks for your time. Goodbye!"

actions:
  - action_ask_questions
  - action_store_answers
  - action_finalize_interview
